<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>做词云</title>
  <link rel="stylesheet" href="/static/style.css?v=16" />
</head>
<body>
  <header class="top">
    <div>
      <h1>做词云</h1>
      <p>粘贴文字，点看效果，再保存图片</p>
      <nav class="switch">
        <a href="/">做图表</a>
        <a class="active" href="/wordcloud">做词云</a>
      </nav>
    </div>
    <div class="top-actions">
      <button id="btn-render" class="primary">看效果</button>
      <label class="preset-wrap">
        背景
        <select id="export-bg">
          <option value="white">白底</option>
          <option value="transparent">透明底</option>
        </select>
      </label>
      <button id="btn-download" class="ghost" disabled>保存图片</button>
    </div>
  </header>

  <ol class="steps">
    <li>左边换成你的词或文章</li>
    <li>点「看效果」</li>
    <li>满意了就「保存图片」，自己选文件夹</li>
  </ol>

  <main class="layout">
    <section class="panel">
      <div class="block">
        <h2>外形</h2>
        <div id="shapes" class="chips"></div>
      </div>
      <div class="block">
        <h2>颜色</h2>
        <div id="palettes" class="chips"></div>
      </div>
      <div class="block">
        <div class="block-head">
          <h2>把词或文章贴在这里</h2>
          <button type="button" id="btn-sample" class="mini">用示例</button>
        </div>
        <textarea id="text" rows="16" placeholder="可以一行一个词，例如：&#10;小米 36&#10;汽车 32&#10;&#10;也可以直接贴一整段文章。"></textarea>
      </div>
      <p class="hint">一行一个词时，后面加数字会更大，例如：小米 36。贴文章会自动拆成词。</p>
    </section>

    <section class="preview">
      <div class="preview-head">
        <div id="status" class="status">正在准备…</div>
        <button type="button" id="btn-shuffle" class="mini">换一换</button>
      </div>
      <div class="canvas">
        <img id="chart" alt="词云预览" hidden />
        <div id="empty" class="empty">点「看效果」后，图会出现在这里</div>
      </div>
    </section>
  </main>

  <script src="/static/wordcloud.js?v=16"></script>
</body>
</html>
