name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[build]"
      - name: Package
        run: |
          python -m PyInstaller packaging/windows/pictureTools.spec --noconfirm --clean --distpath dist --workpath build
          copy packaging\windows\发给对方.txt dist\pictureTools\使用说明.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pictureTools-windows
          path: dist/pictureTools
